<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Send our origin (https://cfx-nui-<resource>) as the Referer when the browser allows it. -->
    <meta name="referrer" content="origin">
    <title>Web Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="panel" hidden>
        <div id="bar">
            <span id="title"></span>
            <div id="actions">
                <button id="reload" title="Reload">&#x21bb;</button>
                <button id="close" title="Close (Esc)">&#x2715;</button>
            </div>
        </div>
        <div id="body">
            <iframe id="frame" src="about:blank" allow="fullscreen; clipboard-read; clipboard-write" referrerpolicy="origin"></iframe>
            <div id="loading" class="overlay" hidden><div class="spinner"></div><p>Loading&hellip;</p></div>
            <div id="failed" class="overlay" hidden>
                <h2>This site can't be shown in game</h2>
                <p>It didn't finish loading. The site may block being shown inside other pages, or it may be down.</p>
                <button id="retry">Try again</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
