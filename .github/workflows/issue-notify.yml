name: Issue notify

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  notify:
    if: >-
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       !contains(github.event.comment.body, '<!-- edison -->') &&
       !contains(github.event.comment.body, '<!-- nicole -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Issues labeled `devticket` (filed by Magistrate DevTickets) go to Nicole;
      # everything else goes to the routine webhook.
      - name: Notify webhook
        env:
          WEBHOOK_URL: ${{ contains(github.event.issue.labels.*.name, 'devticket') && secrets.NICOLE_WEBHOOK_URL || secrets.ROUTINE_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ contains(github.event.issue.labels.*.name, 'devticket') && secrets.NICOLE_WEBHOOK_KEY || secrets.ROUTINE_WEBHOOK_KEY }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            exit 0
          fi
          payload="$(jq -n \
            --arg repo "$REPO" \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg event "$EVENT_NAME" \
            --arg action "$ACTION" \
            --arg actor "$ACTOR" \
            '{repo: $repo, issue_number: $issue_number, event: $event, action: $action, actor: $actor}')"
          curl --silent --show-error --fail-with-body \
            --max-time 20 --retry 2 \
            -X POST \
            -H "Authorization: Bearer ${WEBHOOK_KEY}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$WEBHOOK_URL" > /dev/null
          echo "Notification sent."
